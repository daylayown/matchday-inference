# fly.toml app configuration file generated for matchday-inference-signup on 2026-06-02T19:26:01-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'matchday-inference-signup'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  INFERENCE_DB_PATH = '/data/subscribers.sqlite'

[[mounts]]
  source = 'inference_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  # Keep the machine always warm during the launch/tournament so a cold start
  # can never drop a /signup POST. `min_machines_running` alone did NOT keep a
  # single machine up (Fly still auto-stopped it; first request paid a ~4s cold
  # start), so disable auto-stop outright. Revert to auto_stop_machines='stop'
  # + min_machines_running=0 after the tournament (2026-07-19) to save cost.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
