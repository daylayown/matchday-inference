name: Daily Inference

# Cron runs at 06:30 UTC = 02:30 ET (during tournament window).
# GitHub Actions cron is best-effort; can drift up to 10 minutes. That's
# acceptable for a "first-light" issue.
#
# Schedule guards: GH cron runs every day on the default branch, but the
# tournament window is June 11 – July 19 2026. The first step short-circuits
# outside that window so we don't burn API credits on empty fetches.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      date_iso:
        description: 'ISO date to run for (defaults to today UTC).'
        required: false
        type: string
      issue_number:
        description: 'Issue N° to stamp (e.g. 01).'
        required: false
        default: '01'
      test_email:
        description: 'DRESS REHEARSAL: if set, send ONE issue to this address only (a built-in Mexico/Diaspora test reader). Real subscribers are NOT touched.'
        required: false
        type: string

jobs:
  run-day:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Tournament-window guard
        id: window
        run: |
          today=$(date -u +%Y-%m-%d)
          start="2026-06-10"  # one day early for the dress rehearsal
          end="2026-07-19"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — bypassing tournament-window guard (dress rehearsal)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [[ "$today" > "$end" || "$today" < "$start" ]]; then
            echo "Today $today is outside tournament window ($start..$end). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.window.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.window.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Set up Node + wrangler
        if: steps.window.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        if: steps.window.outputs.skip != 'true'
        run: npm install -g wrangler@4
        # Used by the publish step (R2 upload) inside run_day --send.

      - name: Resolve date + issue number
        if: steps.window.outputs.skip != 'true'
        id: vars
        run: |
          date_iso="${{ github.event.inputs.date_iso }}"
          issue_number="${{ github.event.inputs.issue_number }}"
          if [[ -z "$date_iso" ]]; then
            date_iso=$(date -u +%Y-%m-%d)
          fi
          if [[ -z "$issue_number" ]]; then
            # Day-of-tournament. June 11 is N° 01.
            issue_number=$(( ($(date -d "$date_iso" +%s) - $(date -d "2026-06-10" +%s)) / 86400 ))
            issue_number=$(printf "%02d" "$issue_number")
          fi
          echo "date_iso=$date_iso"           >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number"   >> "$GITHUB_OUTPUT"

      - name: Fetch live subscriber list
        if: steps.window.outputs.skip != 'true'
        env:
          INFERENCE_EXPORT_URL:   ${{ secrets.INFERENCE_EXPORT_URL }}
          INFERENCE_EXPORT_TOKEN: ${{ secrets.INFERENCE_EXPORT_TOKEN }}
          TEST_EMAIL:             ${{ github.event.inputs.test_email }}
        run: |
          if [[ -n "$TEST_EMAIL" ]]; then
            # DRESS REHEARSAL: one built-in test reader → the given address only.
            # Real subscribers are never queried. Email comes via env (not string
            # interpolation) to avoid script injection.
            echo "Dress rehearsal — single test reader → $TEST_EMAIL"
            python - <<'PY'
          import json, os
          json.dump({"readers": [{
              "slug": "rehearsal-mx", "display_name": "Sofía",
              "teams": ["Mexico"], "players": [], "lens": "The Diaspora",
              "length": "Standard",
              "wildcard": "Third-gen Mexican-American in LA; abuelo took me to my first match.",
              "location": "Los Angeles, CA", "email": os.environ["TEST_EMAIL"],
          }]}, open("data/readers.json", "w"))
          PY
          elif [[ -n "$INFERENCE_EXPORT_URL" && -n "$INFERENCE_EXPORT_TOKEN" ]]; then
            # Pull the live list from the Fly endpoint into data/readers.json.
            echo "Fetching subscribers from $INFERENCE_EXPORT_URL"
            curl -sf -H "Authorization: Bearer $INFERENCE_EXPORT_TOKEN" \
              "$INFERENCE_EXPORT_URL" -o data/readers.json
            echo "Subscriber count: $(python -c 'import json,sys; print(len(json.load(open("data/readers.json"))["readers"]))')"
          else
            echo "INFERENCE_EXPORT_URL/TOKEN not set — using committed data/readers.json sample."
          fi

      - name: Run orchestrator
        if: steps.window.outputs.skip != 'true'
        env:
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          API_FOOTBALL_KEY:      ${{ secrets.API_FOOTBALL_KEY }}
          RESEND_API_KEY:        ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL:            ${{ secrets.FROM_EMAIL }}
          # R2 publish (issues are hosted on the web; the email links to them).
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/run_day.py "${{ steps.vars.outputs.date_iso }}" \
            --issue "${{ steps.vars.outputs.issue_number }}" \
            --send

      - name: Upload artifacts (rendered HTML)
        if: steps.window.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: inference-${{ steps.vars.outputs.date_iso }}
          path: output/inferences/
          retention-days: 30
