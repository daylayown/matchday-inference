[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inference"
version = "0.1.0"
description = "THE INFERENCE — daily AI matchday zine for the 2026 FIFA World Cup"
readme = "CLAUDE.md"
requires-python = ">=3.13"
authors = [{ name = "Nicholas de Leon" }]
dependencies = [
    "openai>=2.0",
    "httpx>=0.28",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "resend>=2.0",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
